name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruby:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      # berylx の Gemfile は移行期に darkcore を sibling path 依存で参照する
      # (gem 'darkcore', path: '../darkcore-ruby')。CI では隣接ディレクトリへ
      # 両リポジトリを checkout してから bundle しないと解決できず exit 13 で落ちる。
      - name: Checkout berylx
        uses: actions/checkout@v4
        with:
          path: berylx

      - name: Checkout darkcore-ruby (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: minamorl/darkcore-ruby
          path: darkcore-ruby

      # spinel は test group だけの sibling path 依存
      # (gem 'spinel', path: '../spinel')。ore-stack 条件 B の辺
      # type_to_description を測る test/spinel_contract_test.rb が要求する。
      # runtime 依存ではないが bundle install は解決しに行くので checkout が要る。
      - name: Checkout spinel (test-only sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: minamorl/spinel
          path: spinel

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: berylx

      - name: Run tests
        working-directory: berylx
        run: bundle exec rake test

      - name: Run RuboCop
        working-directory: berylx
        run: bundle exec rubocop

      - name: Syntax-check examples
        working-directory: berylx
        run: ruby -c examples/roda_checkout_app.rb

      - name: Build gem
        working-directory: berylx
        run: gem build berylx.gemspec

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install

      - name: Check formatting
        run: npm run format:check
